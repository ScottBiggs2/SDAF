# SpecDec-AF GPT-2 Phase 1a defaults.
# Path strings support ${VAR} / ${VAR:-default} expansion at load time.

paths:
  cache_dir: "${SCRATCH:-./outputs}/specdec_af/cache"
  output_dir: "${SCRATCH:-./outputs}/specdec_af/outputs"
  log_dir: "${SCRATCH:-./outputs}/specdec_af/logs"

model:
  name: "openai-community/gpt2"
  n_layers: 12
  d_model: 768

trace:
  ctx_len: 128            # v1 window prefix length (collect.py); unused by the rev-7 VAE
  d_chunk: 9984
  J: 12

vae:
  d_latent: 128           # rev-5: bumped from 64. Z_trace per token = 12 × 128 = 1536-d.
  d_block: 64             # rev-7: block_embed is the decoder's only condition (D(z, block_id)).

corpus:
  name: "wikitext"
  config: "wikitext-103-raw-v1"
  split: "train"
  streaming: true
  n_windows: 10000
  n_calibration_windows: 1000

training:
  batch_size: 256
  lr: 5.0e-4              # rev-5: lowered from 1.0e-3; paired with warmup below.
  lr_warmup_steps: 500    # rev-5: linear warmup over the first 500 optimizer steps.
  epochs: 100
  beta_max: 0.01          # was 1.0; reduced to avoid posterior collapse (see outputs/analysis_0516/)
  beta_anneal_epochs: 60  # was 30; slower ramp gives encoder room to find latent structure
  beta_anneal_steps: null # rev-7: β ramp in optimizer steps; overrides beta_anneal_epochs when set
  n_steps: null           # rev-7: step budget (null = epochs × steps/epoch)
  free_bits: 0.1          # Kingma+ 2016: per-dim KL floor in nats. 0.0 = disabled. Keeps KL > 0.
  grad_clip_norm: 1.0     # rev-4: standard fix for option_d spike pattern. null/0 = disabled.
  seed: 42

cluster:
  partition: "gpu"
  gres: "gpu:v100-pcie:1"
  time: "04:00:00"
  mem: "32G"
  cpus_per_task: 4
