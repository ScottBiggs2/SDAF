# SpecDec-AF GPT-2 defaults (trace VAE + streaming data path).
# Path strings support ${VAR} / ${VAR:-default} expansion at load time.

paths:
  cache_dir: "${SCRATCH:-./outputs}/specdec_af/cache_v2"   # rev-7: cache v2 (collect_v2)
  output_dir: "${SCRATCH:-./outputs}/specdec_af/outputs"

model:
  name: "openai-community/gpt2"

vae:
  d_latent: 128           # per block; Z_trace per token = 12 × 128 = 1536-d. (block_embed width 64 is fixed in models/vae.py)
  decoder_output_space: raw  # rev-7 Gate 4: option_d (raw) won the pre-registered rule, val top-1 0.483 vs 0.411.
                             # Default --mode in train.py ("raw" → option_d, "normalized" → option_4).

cache_v2:                 # rev-7: many sampled positions per sequence (collect_v2)
  seq_len: 256
  n_pos: 16               # positions sampled per sequence, uniform w/o replacement
  p_min: 32               # positions drawn from [p_min, seq_len - 1]
  seed: 1234              # position-sampling seed (Stage B adds --seed-offset)
  n_seq: 6250             # Stage A: 6,250 × 16 = 100k positions (≈ 24 GB)
  n_calibration_seq: 1000 # ChunkNorm fit on 16k positions from the same distribution
  seqs_per_shard: 62      # whole sequences per shard → 992 positions (≈ 237 MB)
  val_shards: 6           # pinned in split.json at first collection (~6k positions)
  val_positions: 5000     # fixed val set = first 5k positions of the val shards
  shard_buffer: 4         # shards shuffled together per training buffer

stream:                   # rev-8: producer-consumer (specdec_af/data/stream.py); geometry from cache_v2
  tokens_path: "${SCRATCH:-./outputs}/specdec_af/tokens/wikitext103_train.npy"  # `python -m specdec_af.data.stream pretokenize`
  seqs_per_chunk: 256     # sequences per producer chunk → 4,096 positions × 12 = 49,152 items = 192 batches of 256
  micro_bs: 32            # sequences per GPT-2 forward (hook buffer ≈ 3 GB fp32 at 32 × 256 tokens)
  round_fp16: true        # round live traces to fp16 (the cache-v2 distribution the rev-7 VAE saw)
  seed: 1236              # plan / shuffle / position seed (cache v2 used 1234 Stage A, 1235 Stage B)
  latent_chunks_per_buffer: 4  # LDM consumer: 16,384 positions shuffled together

ldm:                      # rev-8: prompt-conditioned latent diffusion (specdec_af/ldm; agent_plan_rev8.md)
  latents_dir: "${SCRATCH:-./outputs}/specdec_af/outputs/latents/rev7B_optd"   # static export: fallback train + eval
  vae_checkpoint: "${SCRATCH:-./outputs}/specdec_af/outputs/train/rev7B_optd/checkpoints/final.pt"
  data_source: stream     # "stream" (live GPT-2 → frozen VAE, data/stream.py) | "static" (the export). Eval is always static val.
  z_source: mu            # D14: "mu" | "sample" (μ + σ·ε, fresh per draw). Raw VAE coordinates, no transform (D13).
  train_half: all         # D15: "all" | "A" (even global sequence id) | "B" (odd)
  max_train_rows: null    # static only: first N train rows (overfit smoke)
  val_positions: 5000     # = the VAE report's fixed val set (first 5k positions of the val shards)
  condition:              # D1 / D11 / D12
    # W = cache_v2.seq_len, resolved at train start (D18: window locked to GPT-2's context; an explicit W must match)
    mask_id: 50257        # MDLM [MASK] (one past GPT-2's vocab)
    p_null: 0.10          # all-[MASK] incl. x_T, and T dropped → unconditional E
    p_suffix: 0.75        # visible = x_{T-m..T}
    p_holes: 0.15         # full window, each slot except x_T masked i.i.d. at r ~ U(holes_rate)
    p_spans: 0.0          # off by default; lattice experiments: n_spans spans, each visible i.i.d. at span_p
    m_mixture: [[0, 0, 0.15], [1, 8, 0.45], [9, -2, 0.25], [-1, -1, 0.15]]  # [lo, hi, weight]; negative = W + value (-1 = W-1 = full, -2 = W-2), so bins track W
    holes_rate: [0.0, 0.5]
    n_spans: 8
    span_p: 0.5
  encoder:                # D4: MDLM-OWT vocab_embed + DDiT block 0, frozen
    repo: kuleshov-group/mdlm-no_flashattn-fp32-owt
    revision: 60054720485e8aa080d5d2f3eaebafe1b829afb9
    init: pretrained      # "pretrained" | "random" (tests only)
    trainable: false
  dit:                    # D2 / D3 / D10: DiT-S, cross-attention to the prefix + adaLN-Zero
    depth: 12
    d_model: 384
    n_heads: 6
    mlp_hidden: null      # null = (8/3)·d_model rounded up to a multiple of 64 (SwiGLU)
    self_attn_mask: full  # "full" | "diag" (blocks independent given the condition; Stage-7 baseline)
    mask_prestart: true   # D18: pre-start slots dropped from encoder + cross-attention keys (absent ≠ hidden)
  flow:                   # rectified flow, v-prediction
    t_logit_mean: 0.0
    t_logit_std: 1.0
    p_token_t: 0.10       # fraction of batches with i.i.d. per-token t (Diffusion Forcing hedge)
  training:
    batch_size: 256
    lr: 1.0e-4
    weight_decay: 0.0
    lr_warmup_steps: 1000
    grad_clip_norm: 1.0
    ema_decay: 0.9999
    n_steps: 50000
    val_every_steps: 2000
    val_max_positions: 2048
    checkpoint_every_steps: 5000
    seed: 0
  sampler:
    steps: 50
    cfg_w: 1.0

corpus:
  name: "wikitext"
  config: "wikitext-103-raw-v1"
  split: "train"
  streaming: true

training:
  batch_size: 256
  lr: 5.0e-4              # paired with the warmup below.
  lr_warmup_steps: 500    # linear warmup over the first 500 optimizer steps.
  epochs: 100
  beta_max: 0.01          # was 1.0; reduced to avoid posterior collapse (see outputs/analysis_0516/)
  beta_anneal_epochs: 60  # was 30; slower ramp gives encoder room to find latent structure
  beta_anneal_steps: null # rev-7: β ramp in optimizer steps; overrides beta_anneal_epochs when set
  n_steps: null           # rev-7: step budget (null = epochs × steps/epoch)
  free_bits: 0.1          # Kingma+ 2016: per-dim KL floor in nats. 0.0 = disabled. Keeps KL > 0.
  grad_clip_norm: 1.0     # guards option_d loss spikes. null/0 = disabled.
  seed: 42
  data_source: stream     # rev-8: "stream" (live GPT-2) | "cache" (cache-v2 shards; reproduces rev-7)

logging:                  # rev-7
  wandb_project: null     # set via --wandb-project / WANDB_PROJECT in sbatch (null = off, e.g. local/tests)
  wandb_entity: null      # null = the account's default entity

# Cluster resources live in scripts/slurm/*.sh (#SBATCH lines), not here.
